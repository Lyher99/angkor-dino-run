<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Angkor Dino Run — Khmer Pixel Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #120e1c;
      color: #fff6d6;
      font-family: "Courier New", Courier, monospace;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #191228;
      border-bottom: 2px solid #ebb03d;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 20;
    }
    h1 {
      font-size: clamp(15px, 2vw, 20px);
      color: #ffe373;
      letter-spacing: 1.5px;
      text-shadow: 2px 2px 0 #141020;
    }
    .controls-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      background: #2b2142;
      color: #ffe373;
      border: 2px solid #ebb03d;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      outline: none;
      transition: transform 0.08s ease, background 0.12s ease;
    }
    button:hover { background: #3e2f5e; }
    button:active { transform: translateY(1px); }
    button.primary {
      background: linear-gradient(180deg, #f7c948, #d9911e);
      color: #1a1026;
      border-color: #fff1a8;
      font-size: 16px;
      padding: 12px 32px;
      letter-spacing: 1px;
      box-shadow: 0 4px 0 #8f5708, 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    button.primary:hover {
      background: linear-gradient(180deg, #ffe073, #ebb03d);
    }

    .stage {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0915;
      overflow: hidden;
    }
    .game-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(14, 9, 24, 0.72);
      backdrop-filter: blur(2px);
      z-index: 10;
    }
    .overlay.active { display: flex; }

    .panel {
      width: min(860px, 100%);
      max-height: 92%;
      overflow-y: auto;
      background: rgba(24, 17, 40, 0.94);
      border: 3px solid #ebb03d;
      border-radius: 10px;
      padding: 22px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      text-align: center;
    }
    .panel-title {
      font-size: clamp(22px, 3.4vw, 34px);
      color: #ffe373;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 #120b1e;
      margin-bottom: 6px;
    }
    .panel-sub {
      font-size: 13px;
      color: #cbbbe0;
      margin-bottom: 18px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #231938;
      border: 2px solid #594382;
      border-radius: 8px;
      padding: 12px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s ease, border-color 0.12s ease, background 0.12s ease;
    }
    .card:hover {
      border-color: #ebb03d;
      background: #2f224b;
      transform: translateY(-2px);
    }
    .card.selected {
      border-color: #ffe373;
      background: #3b2a5e;
      box-shadow: 0 0 0 2px #ebb03d, 0 0 18px rgba(255, 227, 115, 0.35);
    }
    .card-sprite {
      width: 96px;
      height: 72px;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .card-auto-badge {
      width: 96px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #ffe373;
      background: radial-gradient(circle, #46316e 0%, #24183b 100%);
      border: 2px dashed #ebb03d;
      border-radius: 6px;
    }
    .card-map-thumb {
      width: 100%;
      height: 74px;
      border-radius: 5px;
      border: 1px solid #6b5299;
      background-color: #1a1229;
      background-repeat: no-repeat;
      image-rendering: pixelated;
    }
    .card-name {
      font-size: 13px;
      font-weight: bold;
      color: #ffe373;
    }
    .card-desc {
      font-size: 11px;
      color: #c4b5d9;
      line-height: 1.3;
    }

    .panel-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .touch-btns {
      display: none;
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }
    .touch-btns button {
      pointer-events: auto;
      padding: 14px 26px;
      font-size: 15px;
      opacity: 0.85;
    }
    @media (pointer: coarse) { .touch-btns.playing { display: flex; } }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>ANGKOR DINO RUN</h1>
    <div class="controls-bar">
      <button id="homeBtn">HOME</button>
      <button id="mapBtn">MAPS</button>
      <button id="muteBtn">SFX: ON</button>
      <button id="fsBtn">FULLSCREEN</button>
    </div>
  </div>

  <div class="stage">
    <div class="game-wrap">
      <canvas id="game" width="960" height="540"></canvas>

      <!-- 1. HOME PAGE: Select Character & Play -->
      <div id="homeOverlay" class="overlay active">
        <div class="panel">
          <div class="panel-title">ANGKOR DINO RUN</div>
          <div class="panel-sub">Step 1: Choose your Khmer Hero (or AUTO to evolve with each map)</div>
          <div id="charGrid" class="card-grid"></div>
          <div class="panel-actions">
            <button id="playBtn" class="primary">PLAY &#9654;</button>
          </div>
        </div>
      </div>

      <!-- 2. MAP SELECT PAGE: After clicking PLAY -->
      <div id="mapOverlay" class="overlay">
        <div class="panel">
          <div class="panel-title">SELECT REALM</div>
          <div id="mapSub" class="panel-sub">Step 2: Choose a Map or AUTO to progress through all 4 realms</div>
          <div id="mapGrid" class="card-grid"></div>
          <div class="panel-actions">
            <button id="backHomeBtn">&#8592; CHARACTER</button>
            <button id="startRunBtn" class="primary">START RUN &#9654;</button>
          </div>
        </div>
      </div>

      <!-- 3. GAME OVER OVERLAY -->
      <div id="gameoverOverlay" class="overlay">
        <div class="panel" style="width:min(520px, 100%)">
          <div class="panel-title" style="color:#ff9ec0;">GAME OVER</div>
          <div id="gameoverStats" class="panel-sub" style="font-size:15px;color:#fff6d6;margin-bottom:20px;"></div>
          <div class="panel-actions">
            <button id="retryBtn" class="primary">RETRY &#9654;</button>
            <button id="goMapBtn">CHANGE MAP</button>
            <button id="goHomeBtn">HERO SELECT</button>
          </div>
        </div>
      </div>

      <div id="touchBtns" class="touch-btns">
        <button id="touchDuck">DUCK</button>
        <button id="touchJump">JUMP</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const W = 960;
    const H = 540;
    const GROUND_Y = 444;
    const HERO_SCALE = 3;
    const SPRITE_SCALE = 2;

    const VARIANTS = ["krama_dino", "khmer_tiger", "khmer_hanuman", "khmer_elephant"];
    const HERO_FOLDERS = {
      krama_dino: "v2/forge-dino",
      khmer_tiger: "v2/forge-tiger",
      khmer_hanuman: "v2/forge-hanuman",
      khmer_elephant: "v2/forge-elephant",
    };

    const CHAR_OPTIONS = [
      { id: "auto", name: "AUTO", desc: "Changes with map", preview: null },
      { id: "krama_dino", name: "KRAMA DINO", desc: "Angkor Jade Hero", preview: "v2/forge-dino/run-0.png?v=2" },
      { id: "khmer_tiger", name: "KHMER TIGER", desc: "Royal Bayon Striker", preview: "v2/forge-tiger/run-0.png?v=2" },
      { id: "khmer_hanuman", name: "HANUMAN", desc: "Preah Vihear Warrior", preview: "v2/forge-hanuman/run-0.png?v=2" },
      { id: "khmer_elephant", name: "ELEPHANT", desc: "Ta Prohm Guardian", preview: "v2/forge-elephant/run-0.png?v=2" },
    ];

    const MAP_OPTIONS = [
      { id: "auto", name: "AUTO (ALL 4)", desc: "Changes at 300 / 600 / 900 pts", thumb: null },
      { id: "1", name: "1. ANGKOR WAT", desc: "Golden Sunrise Temple", thumb: "assets/anims/bg_angkor.png", sheet: true },
      { id: "2", name: "2. BAYON NIGHT", desc: "Twilight Stone Faces", thumb: "assets/anims/bg_bayon.png", sheet: true },
      { id: "3", name: "3. PREAH VIHEAR", desc: "Sacred Cliff & Petals", thumb: "assets/sprites/bg_preah_vihear_base.png", sheet: false },
      { id: "4", name: "4. TA PROHM", desc: "Ancient Jungle Roots", thumb: "assets/sprites/bg_ta_prohm_base.png", sheet: false },
    ];

    const HERO_LABELS = Object.fromEntries(CHAR_OPTIONS.map((c) => [c.id, c.name]));
    const MAP_LABELS = { auto: "AUTO", 1: "ANGKOR WAT", 2: "BAYON NIGHT", 3: "PREAH VIHEAR", 4: "TA PROHM" };

    const imgs = {
      heroes: {},
      fx: { dust: [], impact: [], orb: [] },
      bird: [],
      env: {},
    };
    let assetsLoaded = false;

    function loadImg(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = src;
      });
    }

    async function loadAssets() {
      const tasks = [];
      for (const v of VARIANTS) {
        imgs.heroes[v] = {};
        const folder = HERO_FOLDERS[v];
        for (let i = 0; i < 6; i++) {
          tasks.push(
            loadImg(`${folder}/run-${i}.png?v=2`).then((img) => {
              imgs.heroes[v][`run-${i}`] = img;
            })
          );
        }
        for (const fn of ["jump-0", "jump-1", "duck-0", "duck-1", "hit-0"]) {
          tasks.push(
            loadImg(`${folder}/${fn}.png?v=2`).then((img) => {
              imgs.heroes[v][fn] = img;
            })
          );
        }
      }
      for (let i = 0; i < 7; i++) {
        tasks.push(loadImg(`v2/forge-fx/frames/dust-0${i}.png`).then((img) => { imgs.fx.dust[i] = img; }));
      }
      for (let i = 0; i < 5; i++) {
        tasks.push(loadImg(`v2/forge-fx/frames/impact-0${i}.png`).then((img) => { imgs.fx.impact[i] = img; }));
      }
      for (let i = 0; i < 8; i++) {
        tasks.push(loadImg(`v2/forge-fx/frames/orb-0${i}.png`).then((img) => { imgs.fx.orb[i] = img; }));
      }
      for (let i = 0; i < 4; i++) {
        tasks.push(loadImg(`v2/forge-bird-ai-48-clips/frames/frame-0${i}.png?v=2`).then((img) => { imgs.bird[i] = img; }));
      }
      const envPaths = {
        bg_angkor: "assets/anims/bg_angkor.png",
        bg_bayon: "assets/anims/bg_bayon.png",
        bg_preah_vihear: "assets/sprites/bg_preah_vihear_base.png",
        bg_ta_prohm: "assets/sprites/bg_ta_prohm_base.png",
        ground_1: "assets/sprites/ground_tile.png",
        ground_2: "assets/sprites/ground_tile_lv2.png",
        ground_3: "assets/sprites/ground_tile_lv3.png",
        ground_4: "assets/sprites/ground_tile_lv4.png",
        obs_pillar: "assets/sprites/obs_pillar.png",
        obs_naga: "assets/sprites/obs_naga.png",
        fx_petal: "assets/sprites/petal.png",
        fx_leaf: "assets/sprites/leaf.png",
      };
      for (const [k, src] of Object.entries(envPaths)) {
        tasks.push(loadImg(src).then((img) => { imgs.env[k] = img; }));
      }
      await Promise.all(tasks);
      assetsLoaded = true;
    }

    // Audio-Design Bus + Pitch-Varied SFX
    let audioCtx = null;
    let sfxBus = null;
    let muted = false;
    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audioCtx = new AC();
          sfxBus = audioCtx.createGain();
          sfxBus.gain.value = 0.85;
          sfxBus.connect(audioCtx.destination);
        }
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }
    function playTone(freq, endFreq, duration, type = "square", vol = 0.08, jitter = 0.04) {
      if (muted) return;
      ensureAudio();
      if (!audioCtx || !sfxBus) return;
      const pitchMul = 1 + (Math.random() - 0.5) * 2 * jitter;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq * pitchMul, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq * pitchMul), audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(sfxBus);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    const sfx = {
      jump: () => playTone(260, 560, 0.11, "square", 0.07),
      orb: () => {
        playTone(620, 930, 0.09, "triangle", 0.1);
        setTimeout(() => playTone(930, 1240, 0.12, "triangle", 0.09), 60);
      },
      milestone: () => {
        playTone(523, 659, 0.1, "square", 0.07);
        setTimeout(() => playTone(659, 1046, 0.16, "square", 0.07), 90);
      },
      hit: () => playTone(180, 55, 0.25, "sawtooth", 0.11),
    };

    const keys = { jump: false, duck: false };
    // state: "home" | "map_select" | "playing" | "gameover"
    let state = "home";
    let score = 0;
    let highScore = Number(localStorage.getItem("angkor_dino_v2_hi") || 0);
    let speed = 380;
    let dist = 0;
    let spawnTimer = 0.8;
    let lastMilestone = 0;
    let flashTimer = 0;
    let trauma = 0;
    let shakeTime = 0;
    let hitStopTimer = 0;
    let combo = 0;

    let mapMode = localStorage.getItem("angkor_dino_map") || "auto";
    if (!["auto", "1", "2", "3", "4"].includes(mapMode)) mapMode = "auto";
    let charMode = localStorage.getItem("angkor_dino_char") || "auto";
    if (charMode !== "auto" && !VARIANTS.includes(charMode)) charMode = "auto";

    let level = mapMode === "auto" ? 1 : Number(mapMode);
    let levelBannerTimer = 0;
    let levelBannerText = "";

    const homeOverlay = document.getElementById("homeOverlay");
    const mapOverlay = document.getElementById("mapOverlay");
    const gameoverOverlay = document.getElementById("gameoverOverlay");
    const touchBtns = document.getElementById("touchBtns");
    const charGrid = document.getElementById("charGrid");
    const mapGrid = document.getElementById("mapGrid");
    const mapSub = document.getElementById("mapSub");
    const gameoverStats = document.getElementById("gameoverStats");

    const hero = {
      x: 112,
      y: GROUND_Y - 32 * HERO_SCALE,
      vy: 0,
      onGround: true,
      ducking: false,
      animTime: 0,
      jumpBuffer: 0,
      coyote: 0,
      scaleX: 1,
      scaleY: 1,
    };

    let obstacles = [];
    let orbs = [];
    let fxAnims = [];
    let popups = [];
    const motes = Array.from({ length: 16 }, (_, i) => ({
      x: (i * 63) % W,
      y: 60 + ((i * 71) % (GROUND_Y - 100)),
      speed: 25 + (i % 4) * 14,
      phase: i * 0.7,
    }));

    function syncOverlays() {
      homeOverlay.classList.toggle("active", state === "home");
      mapOverlay.classList.toggle("active", state === "map_select");
      gameoverOverlay.classList.toggle("active", state === "gameover");
      touchBtns.classList.toggle("playing", state === "playing");
      if (state === "map_select") {
        mapSub.textContent = `Hero: ${HERO_LABELS[charMode]} — Choose a Map or AUTO to progress through all 4 realms`;
      }
      if (state === "gameover") {
        gameoverStats.textContent = `Score: ${Math.floor(score)}   |   Best: ${highScore}`;
      }
    }

    function renderCards() {
      charGrid.innerHTML = "";
      for (const c of CHAR_OPTIONS) {
        const el = document.createElement("div");
        el.className = "card" + (charMode === c.id ? " selected" : "");
        if (c.preview) {
          el.innerHTML = `<img class="card-sprite" src="${c.preview}" alt="${c.name}" /><div class="card-name">${c.name}</div><div class="card-desc">${c.desc}</div>`;
        } else {
          el.innerHTML = `<div class="card-auto-badge">AUTO</div><div class="card-name">${c.name}</div><div class="card-desc">${c.desc}</div>`;
        }
        el.addEventListener("click", () => {
          charMode = c.id;
          localStorage.setItem("angkor_dino_char", charMode);
          renderCards();
        });
        charGrid.appendChild(el);
      }

      mapGrid.innerHTML = "";
      for (const m of MAP_OPTIONS) {
        const el = document.createElement("div");
        el.className = "card" + (mapMode === m.id ? " selected" : "");
        if (m.thumb) {
          const thumbStyle = m.sheet
            ? `background-image:url('${m.thumb}');background-size:600% 100%;background-position:0 0;`
            : `background-image:url('${m.thumb}');background-size:cover;background-position:center;`;
          el.innerHTML = `<div class="card-map-thumb" style="${thumbStyle}"></div><div class="card-name">${m.name}</div><div class="card-desc">${m.desc}</div>`;
        } else {
          el.innerHTML = `<div class="card-auto-badge" style="width:100%;height:74px;">AUTO</div><div class="card-name">${m.name}</div><div class="card-desc">${m.desc}</div>`;
        }
        el.addEventListener("click", () => {
          mapMode = m.id;
          localStorage.setItem("angkor_dino_map", mapMode);
          level = mapMode === "auto" ? 1 : Number(mapMode);
          renderCards();
        });
        el.addEventListener("dblclick", () => {
          mapMode = m.id;
          localStorage.setItem("angkor_dino_map", mapMode);
          startRun();
        });
        mapGrid.appendChild(el);
      }
    }

    function openHome() {
      state = "home";
      level = mapMode === "auto" ? 1 : Number(mapMode);
      obstacles = [];
      orbs = [];
      fxAnims = [];
      popups = [];
      syncOverlays();
      renderCards();
    }

    function openMapSelect() {
      state = "map_select";
      level = mapMode === "auto" ? 1 : Number(mapMode);
      obstacles = [];
      orbs = [];
      fxAnims = [];
      popups = [];
      syncOverlays();
      renderCards();
    }

    function spawnFx(kind, x, y, scale = 2) {
      fxAnims.push({ kind, x, y, scale, t: 0, duration: kind === "dust" ? 0.36 : 0.32 });
    }

    function getLevelBanner(lvl) {
      return lvl === 4 ? "LEVEL 4: TA PROHM ROOTS!" :
        lvl === 3 ? "LEVEL 3: PREAH VIHEAR SKY!" :
        lvl === 2 ? "LEVEL 2: BAYON TWILIGHT!" : "LEVEL 1: ANGKOR WAT!";
    }

    function startRun() {
      score = 0;
      level = mapMode === "auto" ? 1 : Number(mapMode);
      speed = 380;
      dist = 0;
      spawnTimer = 0.9;
      lastMilestone = 0;
      flashTimer = 0;
      trauma = 0;
      hitStopTimer = 0;
      combo = 0;
      levelBannerTimer = 2.0;
      levelBannerText = getLevelBanner(level);
      hero.y = GROUND_Y - 32 * HERO_SCALE;
      hero.vy = 0;
      hero.onGround = true;
      hero.ducking = false;
      hero.animTime = 0;
      hero.jumpBuffer = 0;
      hero.scaleX = 1;
      hero.scaleY = 1;
      obstacles = [];
      orbs = [];
      fxAnims = [];
      popups = [];
      state = "playing";
      syncOverlays();
    }

    function spawnObstacle() {
      const r = Math.random();
      if (score > 80 && r < 0.32) {
        const high = Math.random() < 0.6;
        obstacles.push({
          type: "garuda",
          x: W + 40,
          y: high ? GROUND_Y - 154 : GROUND_Y - 102,
          w: 64 * 2,
          h: 56 * 2,
          animTime: Math.random() * 0.5,
        });
      } else if (r < 0.66) {
        obstacles.push({
          type: "pillar",
          x: W + 40,
          y: GROUND_Y - 28 * 3,
          w: 24 * 3,
          h: 38 * 3,
        });
      } else {
        obstacles.push({
          type: "naga",
          x: W + 40,
          y: GROUND_Y - 19 * 3,
          w: 36 * 3,
          h: 32 * 3,
        });
      }
      if (Math.random() < 0.5) {
        orbs.push({
          x: W + 220 + Math.random() * 120,
          y: GROUND_Y - (Math.random() < 0.5 ? 78 : 148),
          size: 48 * 1.5,
          t: Math.random(),
        });
      }
    }

    function getHeroHitbox() {
      if (hero.ducking && hero.onGround) {
        return { x: hero.x + 22, y: GROUND_Y - 46, w: 54, h: 42 };
      }
      return { x: hero.x + 26, y: hero.y + 24, w: 44, h: 68 };
    }

    function boxesOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function triggerJump() {
      if (state === "playing") {
        hero.jumpBuffer = 0.12;
      }
    }

    window.addEventListener("keydown", (e) => {
      if (["Space", "ArrowUp", "KeyW", "Enter"].includes(e.code)) {
        e.preventDefault();
        if (state === "home") { openMapSelect(); return; }
        if (state === "map_select") { startRun(); return; }
        if (state === "gameover") { startRun(); return; }
        if (!keys.jump) triggerJump();
        keys.jump = true;
      }
      if (["ArrowDown", "KeyS"].includes(e.code)) {
        e.preventDefault();
        keys.duck = true;
      }
    });
    window.addEventListener("keyup", (e) => {
      if (["Space", "ArrowUp", "KeyW"].includes(e.code)) keys.jump = false;
      if (["ArrowDown", "KeyS"].includes(e.code)) keys.duck = false;
    });

    canvas.addEventListener("pointerdown", () => {
      if (state === "playing") triggerJump();
    });

    document.getElementById("playBtn").addEventListener("click", openMapSelect);
    document.getElementById("backHomeBtn").addEventListener("click", openHome);
    document.getElementById("startRunBtn").addEventListener("click", startRun);
    document.getElementById("retryBtn").addEventListener("click", startRun);
    document.getElementById("goMapBtn").addEventListener("click", openMapSelect);
    document.getElementById("goHomeBtn").addEventListener("click", openHome);
    document.getElementById("homeBtn").addEventListener("click", (e) => { e.target.blur(); openHome(); });
    document.getElementById("mapBtn").addEventListener("click", (e) => { e.target.blur(); openMapSelect(); });

    document.getElementById("muteBtn").addEventListener("click", (e) => {
      muted = !muted;
      e.target.textContent = muted ? "SFX: OFF" : "SFX: ON";
      e.target.blur();
    });

    const fsBtn = document.getElementById("fsBtn");
    fsBtn.addEventListener("click", (e) => {
      e.target.blur();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
    document.addEventListener("fullscreenchange", () => {
      fsBtn.textContent = document.fullscreenElement ? "EXIT FULLSCREEN" : "FULLSCREEN";
    });

    document.getElementById("touchJump").addEventListener("pointerdown", (e) => {
      e.preventDefault(); triggerJump(); keys.jump = true;
    });
    document.getElementById("touchJump").addEventListener("pointerup", () => { keys.jump = false; });
    document.getElementById("touchDuck").addEventListener("pointerdown", (e) => {
      e.preventDefault(); keys.duck = true;
    });
    document.getElementById("touchDuck").addEventListener("pointerup", () => { keys.duck = false; });

    function update(dt) {
      if (flashTimer > 0) flashTimer -= dt;
      if (trauma > 0) {
        trauma = Math.max(0, trauma - 1.6 * dt);
        shakeTime += dt * 32;
      }
      if (levelBannerTimer > 0) levelBannerTimer -= dt;
      if (hitStopTimer > 0) { hitStopTimer -= dt; return; }

      hero.scaleX += (1 - hero.scaleX) * Math.min(1, dt * 16);
      hero.scaleY += (1 - hero.scaleY) * Math.min(1, dt * 16);

      for (const m of motes) {
        m.x -= (m.speed + (state === "playing" ? speed * 0.15 : 0)) * dt;
        m.phase += dt * 3;
        if (m.x < -8) m.x = W + 8;
      }

      if (state !== "playing") {
        hero.animTime += dt;
        return;
      }

      speed = Math.min(880, 380 + score * 0.42);
      dist += speed * dt;
      score += dt * 14;

      if (mapMode === "auto") {
        if (level === 1 && score >= 300) {
          level = 2; levelBannerTimer = 2.4; levelBannerText = getLevelBanner(2);
          flashTimer = 0.2; trauma = Math.min(1, trauma + 0.35); sfx.milestone();
        } else if (level === 2 && score >= 600) {
          level = 3; levelBannerTimer = 2.6; levelBannerText = getLevelBanner(3);
          flashTimer = 0.25; trauma = Math.min(1, trauma + 0.4); sfx.milestone();
        } else if (level === 3 && score >= 900) {
          level = 4; levelBannerTimer = 2.6; levelBannerText = getLevelBanner(4);
          flashTimer = 0.25; trauma = Math.min(1, trauma + 0.45); sfx.milestone();
        }
      }

      const curMilestone = Math.floor(score / 100);
      if (curMilestone > lastMilestone && curMilestone > 0) {
        lastMilestone = curMilestone;
        sfx.milestone();
      }

      hero.ducking = keys.duck;
      if (hero.onGround) hero.coyote = 0.08;
      else hero.coyote = Math.max(0, hero.coyote - dt);
      if (hero.jumpBuffer > 0) hero.jumpBuffer -= dt;

      if (hero.jumpBuffer > 0 && hero.coyote > 0) {
        hero.vy = -750;
        hero.onGround = false;
        hero.coyote = 0;
        hero.jumpBuffer = 0;
        hero.scaleX = 0.84;
        hero.scaleY = 1.18;
        sfx.jump();
        spawnFx("dust", hero.x + 12, GROUND_Y - 76, 2);
      }

      let grav = 2300;
      if (hero.vy < 0 && !keys.jump) grav = 3800;
      if (keys.duck && !hero.onGround) grav = 5000;
      hero.vy += grav * dt;
      hero.y += hero.vy * dt;

      if (hero.y >= GROUND_Y - 32 * HERO_SCALE) {
        if (!hero.onGround) {
          hero.scaleX = 1.2;
          hero.scaleY = 0.82;
          spawnFx("dust", hero.x + 14, GROUND_Y - 76, 2);
        }
        hero.y = GROUND_Y - 32 * HERO_SCALE;
        hero.vy = 0;
        hero.onGround = true;
      }

      hero.animTime += dt * (speed / 380);

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnObstacle();
        const minGap = Math.max(0.68, 1.45 - (speed - 380) / 720);
        spawnTimer = minGap + Math.random() * 0.65;
      }

      const hBox = getHeroHitbox();
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= (o.type === "garuda" ? speed * 1.15 : speed) * dt;
        if (o.animTime !== undefined) o.animTime += dt;
        const oBox = { x: o.x + 14, y: o.y + 10, w: o.w - 28, h: o.h - 14 };
        if (boxesOverlap(hBox, oBox)) {
          state = "gameover";
          flashTimer = 0.25;
          trauma = 0.85;
          hitStopTimer = 0.08;
          sfx.hit();
          spawnFx("impact", hBox.x + 10, hBox.y + 10, 2);
          if (Math.floor(score) > highScore) {
            highScore = Math.floor(score);
            localStorage.setItem("angkor_dino_v2_hi", String(highScore));
          }
          syncOverlays();
          break;
        }
        if (o.x + o.w < -40) obstacles.splice(i, 1);
      }

      for (let i = orbs.length - 1; i >= 0; i--) {
        const ob = orbs[i];
        ob.x -= speed * dt;
        ob.t += dt;
        if (boxesOverlap(hBox, { x: ob.x + 10, y: ob.y + 10, w: ob.size - 20, h: ob.size - 20 })) {
          combo = Math.min(4, combo + 1);
          const pts = 50 * combo;
          score += pts;
          trauma = Math.min(1, trauma + 0.18);
          sfx.orb();
          spawnFx("impact", ob.x, ob.y, 1.8);
          popups.push({ x: ob.x + ob.size / 2, y: ob.y, text: combo > 1 ? `+${pts} x${combo}` : `+${pts}`, life: 0.85 });
          orbs.splice(i, 1);
          continue;
        }
        if (ob.x + ob.size < -40) {
          combo = 0;
          orbs.splice(i, 1);
        }
      }

      for (let i = fxAnims.length - 1; i >= 0; i--) {
        fxAnims[i].t += dt;
        if (fxAnims[i].t >= fxAnims[i].duration) fxAnims.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].y -= 48 * dt;
        popups[i].life -= dt;
        if (popups[i].life <= 0) popups.splice(i, 1);
      }
    }

    function render() {
      if (!assetsLoaded) {
        ctx.fillStyle = "#141020";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#ffe373";
        ctx.font = "bold 24px Courier New";
        ctx.textAlign = "center";
        ctx.fillText("Loading Angkor Dino Run...", W / 2, H / 2);
        return;
      }

      ctx.save();
      if (trauma > 0) {
        const shake = trauma * trauma;
        ctx.translate(Math.round(14 * shake * Math.sin(shakeTime * 1.7)), Math.round(10 * shake * Math.sin(shakeTime * 2.3)));
      }

      // 1. Background
      const bgFrame = Math.floor(performance.now() / 167) % 6;
      if (level === 4) ctx.drawImage(imgs.env.bg_ta_prohm, 0, 0, W, H);
      else if (level === 3) ctx.drawImage(imgs.env.bg_preah_vihear, 0, 0, W, H);
      else if (level === 2) ctx.drawImage(imgs.env.bg_bayon, bgFrame * 480, 0, 480, 270, 0, 0, W, H);
      else ctx.drawImage(imgs.env.bg_angkor, bgFrame * 480, 0, 480, 270, 0, 0, W, H);

      ctx.fillStyle = level === 2 ? "rgba(10, 8, 22, 0.16)" : "rgba(20, 14, 30, 0.08)";
      ctx.fillRect(0, 0, W, GROUND_Y);

      for (let i = 0; i < motes.length; i++) {
        const m = motes[i];
        const my = m.y + Math.sin(m.phase) * 8;
        if (level === 4) ctx.drawImage(imgs.env.fx_leaf, Math.round(m.x), Math.round(my), 12, 12);
        else if (level === 3) ctx.drawImage(imgs.env.fx_petal, Math.round(m.x), Math.round(my), 12, 12);
        else {
          ctx.fillStyle = "#ffe373";
          ctx.fillRect(Math.round(m.x), Math.round(my), 3, 3);
        }
      }

      // 2. Ground
      const gTileW = 128;
      const gOff = Math.floor(dist) % gTileW;
      const gImg = imgs.env["ground_" + level];
      for (let x = -gOff; x < W; x += gTileW) ctx.drawImage(gImg, x, GROUND_Y, gTileW, 96);

      // 3. Collectible Orbs
      for (const ob of orbs) {
        const f = Math.floor(ob.t * 16) % 8;
        ctx.drawImage(imgs.fx.orb[f], Math.round(ob.x), Math.round(ob.y), ob.size, ob.size);
      }

      // 4. Obstacles
      for (const o of obstacles) {
        if (o.type === "pillar") ctx.drawImage(imgs.env.obs_pillar, Math.round(o.x), Math.round(o.y), o.w, o.h);
        else if (o.type === "naga") ctx.drawImage(imgs.env.obs_naga, Math.round(o.x), Math.round(o.y), o.w, o.h);
        else {
          const f = Math.floor(o.animTime * 9) % 4;
          ctx.drawImage(imgs.bird[f], Math.round(o.x), Math.round(o.y), o.w, o.h);
        }
      }

      // 5. Hero (64x48 Krama Dino/Tiger/Hanuman/Elephant @2x = 128x96)
      const activeVariant = charMode !== "auto" ? charMode : VARIANTS[level - 1];
      let frameKey = "run-0";
      if (state === "gameover" && imgs.heroes[activeVariant]["hit-0"]) frameKey = "hit-0";
      else if (!hero.onGround) frameKey = hero.vy < 0 ? "jump-0" : "jump-1";
      else if (hero.ducking && state === "playing") frameKey = "duck-" + (Math.floor(hero.animTime * 10) % 2);
      else frameKey = "run-" + (Math.floor(hero.animTime * 10) % 6);

      const hImg = imgs.heroes[activeVariant][frameKey];
      const drawW = 64 * SPRITE_SCALE;
      const drawH = 48 * SPRITE_SCALE;
      const drawX = hero.x - 14;
      ctx.save();
      const px = drawX + drawW / 2;
      const py = GROUND_Y;
      ctx.translate(px, py);
      ctx.scale(hero.scaleX, hero.scaleY);
      ctx.translate(-px, -py);
      ctx.drawImage(hImg, Math.round(drawX), Math.round(hero.y), drawW, drawH);
      ctx.restore();

      // 6. FX Clips (dust & impact)
      for (const fx of fxAnims) {
        const arr = imgs.fx[fx.kind];
        const idx = Math.min(arr.length - 1, Math.floor((fx.t / fx.duration) * arr.length));
        ctx.drawImage(arr[idx], Math.round(fx.x), Math.round(fx.y), 48 * fx.scale, 48 * fx.scale);
      }

      // 7. Popups & HUD
      ctx.textAlign = "center";
      ctx.font = "bold 20px Courier New";
      for (const pop of popups) {
        ctx.fillStyle = "#141020";
        ctx.fillText(pop.text, Math.round(pop.x) + 2, Math.round(pop.y) + 2);
        ctx.fillStyle = "#ffe373";
        ctx.fillText(pop.text, Math.round(pop.x), Math.round(pop.y));
      }

      ctx.textAlign = "left";
      ctx.font = "bold 15px Courier New";
      ctx.fillStyle = "#141020";
      ctx.fillText(`${MAP_LABELS[level]} · ${HERO_LABELS[activeVariant]}`, 26, 36);
      ctx.fillStyle = "#ffe373";
      ctx.fillText(`${MAP_LABELS[level]} · ${HERO_LABELS[activeVariant]}`, 24, 34);

      ctx.textAlign = "right";
      ctx.font = "bold 26px Courier New";
      ctx.fillStyle = "#141020";
      ctx.fillText(`HI ${String(highScore).padStart(5, "0")}  ${String(Math.floor(score)).padStart(5, "0")}`, W - 26, 40);
      ctx.fillStyle = "#fff6d6";
      ctx.fillText(`HI ${String(highScore).padStart(5, "0")}  ${String(Math.floor(score)).padStart(5, "0")}`, W - 28, 38);

      if (levelBannerTimer > 0 && state === "playing") {
        ctx.fillStyle = "rgba(20, 16, 32, 0.78)";
        ctx.fillRect(W / 2 - 240, 56, 480, 48);
        ctx.strokeStyle = "#ffe373";
        ctx.lineWidth = 3;
        ctx.strokeRect(W / 2 - 240, 56, 480, 48);
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffe373";
        ctx.font = "bold 22px Courier New";
        ctx.fillText(levelBannerText, W / 2, 87);
      }

      if (flashTimer > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashTimer * 2})`;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    renderCards();
    syncOverlays();
    loadAssets().then(() => {
      render();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
