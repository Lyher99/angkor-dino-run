<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Angkor Dino Run — Khmer Pixel Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #120e1c;
      color: #fff6d6;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(960px, 100%);
      margin-bottom: 10px;
      gap: 12px;
    }
    h1 {
      font-size: clamp(16px, 2.5vw, 22px);
      color: #ffe373;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #141020;
    }
    .controls-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      background: #2b2142;
      color: #ffe373;
      border: 2px solid #ebb03d;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #3e2f5e; }
    .game-wrap {
      position: relative;
      width: min(960px, 100%);
      aspect-ratio: 16 / 9;
      border: 3px solid #ebb03d;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.7);
      background: #2d1e40;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .footer {
      width: min(960px, 100%);
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: #c4b5d9;
    }
    .touch-btns {
      display: none;
      width: min(960px, 100%);
      gap: 12px;
      margin-top: 10px;
    }
    .touch-btns button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
    }
    @media (pointer: coarse) {
      .touch-btns { display: flex; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ANGKOR DINO RUN</h1>
    <div class="controls-bar">
      <button id="levelBtn">LVL 1: ANGKOR WAT</button>
      <button id="charBtn">CHAR: AUTO</button>
      <button id="muteBtn">SFX: ON</button>
      <button id="restartBtn">RESTART</button>
    </div>
  </div>

  <div class="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>
  </div>

  <div class="touch-btns">
    <button id="touchDuck">DUCK</button>
    <button id="touchJump">JUMP</button>
  </div>

  <div class="footer">
    <span><b>SPACE / UP / W</b>: Jump &nbsp;|&nbsp; <b>DOWN / S</b>: Duck &amp; Fast-Fall</span>
    <span>Built with <b>pxl</b> pixel-art assets (960×540 HD)</span>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const W = 960;
    const H = 540;
    const GROUND_Y = 444; // top of ground_tile
    const S = 2; // unified 2x pixel scale (480x270 -> 960x540)

    // Asset manifest (4 Levels + 4 Characters + SpriteCast effects + pxl tiles)
    const V = "?v=10";
    const ASSET_PATHS = {
      dino_run: "assets/anims/dino_run.png" + V,
      dino_duck: "assets/anims/dino_duck.png" + V,
      dino_jump: "assets/anims/dino_jump.png" + V,
      singha_run: "assets/anims/singha_run.png" + V,
      singha_duck: "assets/anims/singha_duck.png" + V,
      singha_jump: "assets/anims/singha_jump.png" + V,
      hanuman_run: "assets/anims/hanuman_run.png" + V,
      hanuman_duck: "assets/anims/hanuman_duck.png" + V,
      hanuman_jump: "assets/anims/hanuman_jump.png" + V,
      garuda_run: "assets/anims/garuda_run.png" + V,
      garuda_duck: "assets/anims/garuda_duck.png" + V,
      garuda_jump: "assets/anims/garuda_jump.png" + V,
      fly_garuda: "assets/anims/fly_garuda.png" + V,
      item_lotus: "assets/anims/item_lotus.png" + V,
      obs_pillar: "assets/sprites/obs_pillar.png" + V,
      obs_naga: "assets/sprites/obs_naga.png" + V,
      ground_tile: "assets/sprites/ground_tile.png" + V,
      ground_tile_lv2: "assets/sprites/ground_tile_lv2.png" + V,
      ground_tile_lv3: "assets/sprites/ground_tile_lv3.png" + V,
      ground_tile_lv4: "assets/sprites/ground_tile_lv4.png" + V,
      bg_angkor: "assets/anims/bg_angkor.png" + V,
      bg_bayon: "assets/anims/bg_bayon.png" + V,
      bg_preah_vihear: "assets/sprites/bg_preah_vihear_base.png" + V,
      bg_ta_prohm: "assets/sprites/bg_ta_prohm_base.png" + V,
      fx_petal: "assets/sprites/petal.png" + V,
      fx_spark: "assets/sprites/spark.png" + V,
      fx_leaf: "assets/sprites/leaf.png" + V,
      fx_greenleaf: "assets/sprites/greenleaf.png" + V,
    };

    const imgs = {};
    let assetsLoaded = false;

    function loadAssets() {
      const entries = Object.entries(ASSET_PATHS);
      let count = 0;
      return new Promise((resolve) => {
        for (const [key, src] of entries) {
          const img = new Image();
          img.onload = () => {
            imgs[key] = img;
            count++;
            if (count === entries.length) {
              assetsLoaded = true;
              resolve();
            }
          };
          img.src = src;
        }
      });
    }

    // Audio-Design Bus Layout + Pitch-Varied Retro Web Audio SFX
    let audioCtx = null;
    let sfxBus = null;
    let muted = false;
    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audioCtx = new AC();
          sfxBus = audioCtx.createGain();
          sfxBus.gain.value = 0.85;
          sfxBus.connect(audioCtx.destination);
        }
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }
    function playTone(freq, endFreq, duration, type = "square", vol = 0.08, jitter = 0.04) {
      if (muted) return;
      ensureAudio();
      if (!audioCtx || !sfxBus) return;
      const pitchMul = 1 + (Math.random() - 0.5) * 2 * jitter;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq * pitchMul, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq * pitchMul), audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(sfxBus);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const sfx = {
      jump: () => playTone(240, 520, 0.11, "square", 0.07),
      lotus: () => {
        playTone(587, 880, 0.09, "triangle", 0.1);
        setTimeout(() => playTone(880, 1175, 0.12, "triangle", 0.09), 65);
      },
      milestone: () => {
        playTone(523, 659, 0.1, "square", 0.07);
        setTimeout(() => playTone(659, 1046, 0.16, "square", 0.07), 90);
      },
      hit: () => playTone(180, 55, 0.25, "sawtooth", 0.11),
    };

    // Game State
    const keys = { jump: false, duck: false };
    let state = "ready"; // ready | playing | gameover
    let score = 0;
    let highScore = Number(localStorage.getItem("angkor_dino_hi") || 0);
    let speed = 370; // px/sec on 960x540
    let dist = 0;
    let spawnTimer = 0.8;
    let lastMilestone = 0;
    let flashTimer = 0;
    let trauma = 0; // game-feel trauma (0..1)
    let shakeTime = 0;
    let hitStopTimer = 0; // brief freeze on impact/level-up
    let combo = 0;
    let level = 1; // 1 = Angkor Wat, 2 = Bayon, 3 = Preah Vihear, 4 = Ta Prohm
    let manualLevel = null; // null = auto at 300/600/900 pts, or 1..4
    let charMode = "auto"; // auto | dino | singha | hanuman | garuda
    let levelBannerTimer = 0;
    let levelBannerText = "";

    const dino = {
      x: 112,
      y: GROUND_Y - 40 * 3,
      vy: 0,
      onGround: true,
      ducking: false,
      animTime: 0,
      jumpBuffer: 0,
      coyote: 0,
      scaleX: 1,
      scaleY: 1,
    };

    let obstacles = [];
    let lotuses = [];
    let particles = [];
    let popups = [];
    const motes = Array.from({ length: 18 }, (_, i) => ({
      x: (i * 57) % W,
      y: 60 + ((i * 73) % (GROUND_Y - 90)),
      speed: 25 + (i % 4) * 12,
      phase: i * 0.7,
    }));

    function updateLevelUI() {
      const btn = document.getElementById("levelBtn");
      btn.textContent =
        level === 1 ? "LVL 1: ANGKOR WAT" :
        level === 2 ? "LVL 2: BAYON NIGHT" :
        level === 3 ? "LVL 3: PREAH VIHEAR" :
        "LVL 4: TA PROHM";
    }

    function resetGame() {
      score = manualLevel === 4 ? 900 : manualLevel === 3 ? 600 : manualLevel === 2 ? 300 : 0;
      level = manualLevel ?? 1;
      speed = level === 4 ? 640 : level === 3 ? 580 : level === 2 ? 500 : 370;
      dist = 0;
      spawnTimer = 0.9;
      lastMilestone = Math.floor(score / 100);
      flashTimer = 0;
      trauma = 0;
      hitStopTimer = 0;
      combo = 0;
      levelBannerTimer = level >= 2 ? 2.2 : 0;
      levelBannerText =
        level === 4 ? "LEVEL 4: TA PROHM ROOTS!" :
        level === 3 ? "LEVEL 3: PREAH VIHEAR SKY!" :
        level === 2 ? "LEVEL 2: BAYON TWILIGHT!" : "";
      dino.y = GROUND_Y - 40 * 3;
      dino.vy = 0;
      dino.onGround = true;
      dino.ducking = false;
      dino.animTime = 0;
      dino.jumpBuffer = 0;
      dino.scaleX = 1;
      dino.scaleY = 1;
      obstacles = [];
      lotuses = [];
      particles = [];
      popups = [];
      state = "playing";
      updateLevelUI();
    }

    function spawnDust(x, y, count = 6, color = "#e6c69c") {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 28,
          y: y - Math.random() * 8,
          vx: -80 - Math.random() * 120,
          vy: -40 - Math.random() * 100,
          life: 0.35 + Math.random() * 0.25,
          maxLife: 0.6,
          size: Math.random() < 0.5 ? 4 : 6,
          color,
        });
      }
    }

    function spawnObstacle() {
      const r = Math.random();
      if (score > 80 && r < 0.32) {
        const high = Math.random() < 0.6;
        obstacles.push({
          type: "garuda",
          x: W + 40,
          y: high ? GROUND_Y - 72 * S : GROUND_Y - 40 * S,
          w: 32 * 3,
          h: 24 * 3,
          animTime: Math.random() * 0.5,
        });
      } else if (r < 0.66) {
        obstacles.push({
          type: "pillar",
          x: W + 40,
          y: GROUND_Y - 38 * 3,
          w: 24 * 3,
          h: 38 * 3,
        });
      } else {
        obstacles.push({
          type: "naga",
          x: W + 40,
          y: GROUND_Y - 32 * 3,
          w: 36 * 3,
          h: 32 * 3,
        });
      }

      if (Math.random() < 0.45) {
        lotuses.push({
          x: W + 220 + Math.random() * 120,
          y: GROUND_Y - (Math.random() < 0.5 ? 42 * S : 82 * S),
          w: 20 * 3,
          h: 20 * 3,
          animTime: 0,
        });
      }
    }

    function getDinoHitbox() {
      if (dino.ducking && dino.onGround) {
        return { x: dino.x + 20, y: GROUND_Y - 30 * S, w: 46 * S, h: 28 * S };
      }
      return { x: dino.x + 28, y: dino.y + 18 * S, w: 34 * S, h: 32 * S };
    }

    function boxesOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function triggerJump() {
      if (state === "ready" || state === "gameover") {
        resetGame();
        return;
      }
      dino.jumpBuffer = 0.12;
    }

    // Input listeners
    window.addEventListener("keydown", (e) => {
      if (["Space", "ArrowUp", "KeyW"].includes(e.code)) {
        e.preventDefault();
        if (!keys.jump) triggerJump();
        keys.jump = true;
      }
      if (["ArrowDown", "KeyS"].includes(e.code)) {
        e.preventDefault();
        keys.duck = true;
      }
    });
    window.addEventListener("keyup", (e) => {
      if (["Space", "ArrowUp", "KeyW"].includes(e.code)) keys.jump = false;
      if (["ArrowDown", "KeyS"].includes(e.code)) keys.duck = false;
    });

    canvas.addEventListener("pointerdown", () => triggerJump());
    document.getElementById("restartBtn").addEventListener("click", () => resetGame());
    document.getElementById("levelBtn").addEventListener("click", () => {
      manualLevel = level === 1 ? 2 : level === 2 ? 3 : level === 3 ? 4 : 1;
      level = manualLevel;
      levelBannerTimer = 2.0;
      levelBannerText =
        level === 4 ? "LEVEL 4: TA PROHM ROOTS!" :
        level === 3 ? "LEVEL 3: PREAH VIHEAR SKY!" :
        level === 2 ? "LEVEL 2: BAYON TWILIGHT!" :
        "LEVEL 1: ANGKOR WAT!";
      updateLevelUI();
      if (state === "ready") render();
    });
    document.getElementById("charBtn").addEventListener("click", (e) => {
      charMode =
        charMode === "auto" ? "dino" :
        charMode === "dino" ? "singha" :
        charMode === "singha" ? "hanuman" :
        charMode === "hanuman" ? "garuda" : "auto";
      e.target.textContent = "CHAR: " + charMode.toUpperCase();
    });
    document.getElementById("muteBtn").addEventListener("click", (e) => {
      muted = !muted;
      e.target.textContent = muted ? "SFX: OFF" : "SFX: ON";
    });
    document.getElementById("touchJump").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      triggerJump();
      keys.jump = true;
    });
    document.getElementById("touchJump").addEventListener("pointerup", () => { keys.jump = false; });
    document.getElementById("touchDuck").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      keys.duck = true;
    });
    document.getElementById("touchDuck").addEventListener("pointerup", () => { keys.duck = false; });

    function update(dt) {
      if (flashTimer > 0) flashTimer -= dt;
      if (trauma > 0) {
        trauma = Math.max(0, trauma - 1.6 * dt);
        shakeTime += dt * 32;
      }
      if (levelBannerTimer > 0) levelBannerTimer -= dt;

      // Hit-stop freezes simulation briefly for punchy impact
      if (hitStopTimer > 0) {
        hitStopTimer -= dt;
        return;
      }

      // Smoothly spring squash-and-stretch back to 1.0
      dino.scaleX += (1 - dino.scaleX) * Math.min(1, dt * 16);
      dino.scaleY += (1 - dino.scaleY) * Math.min(1, dt * 16);

      for (const m of motes) {
        m.x -= (m.speed + (state === "playing" ? speed * 0.15 : 0)) * dt;
        m.phase += dt * 3;
        if (m.x < -8) m.x = W + 8;
      }

      if (state !== "playing") {
        dino.animTime += dt;
        return;
      }

      // Ramp speed smoothly
      speed = Math.min(880, 370 + score * 0.42);
      dist += speed * dt;
      score += dt * 14;

      // Auto-advance Levels at 300, 600, 900 points (unless pinned)
      if (manualLevel === null && level === 1 && score >= 300) {
        level = 2;
        levelBannerTimer = 2.4;
        levelBannerText = "LEVEL 2: BAYON TWILIGHT!";
        flashTimer = 0.2;
        trauma = Math.min(1, trauma + 0.35);
        sfx.milestone();
        updateLevelUI();
      } else if (manualLevel === null && level === 2 && score >= 600) {
        level = 3;
        levelBannerTimer = 2.6;
        levelBannerText = "LEVEL 3: PREAH VIHEAR SKY!";
        flashTimer = 0.25;
        trauma = Math.min(1, trauma + 0.4);
        sfx.milestone();
        updateLevelUI();
      } else if (manualLevel === null && level === 3 && score >= 900) {
        level = 4;
        levelBannerTimer = 2.6;
        levelBannerText = "LEVEL 4: TA PROHM ROOTS!";
        flashTimer = 0.25;
        trauma = Math.min(1, trauma + 0.45);
        sfx.milestone();
        updateLevelUI();
      }

      const curMilestone = Math.floor(score / 100);
      if (curMilestone > lastMilestone && curMilestone > 0) {
        lastMilestone = curMilestone;
        sfx.milestone();
      }

      // Dino jump & gravity
      dino.ducking = keys.duck;
      if (dino.onGround) dino.coyote = 0.08;
      else dino.coyote = Math.max(0, dino.coyote - dt);

      if (dino.jumpBuffer > 0) dino.jumpBuffer -= dt;

      if (dino.jumpBuffer > 0 && dino.coyote > 0) {
        dino.vy = -750;
        dino.onGround = false;
        dino.coyote = 0;
        dino.jumpBuffer = 0;
        dino.scaleX = 0.84;
        dino.scaleY = 1.18;
        sfx.jump();
        spawnDust(dino.x + 44, GROUND_Y, 8);
      }

      // Variable jump height & fast-fall
      let grav = 2300;
      if (dino.vy < 0 && !keys.jump) grav = 3800;
      if (keys.duck && !dino.onGround) grav = 5000;

      dino.vy += grav * dt;
      dino.y += dino.vy * dt;

      if (dino.y >= GROUND_Y - 40 * 3) {
        if (!dino.onGround) {
          spawnDust(dino.x + 48, GROUND_Y, 6);
          dino.scaleX = 1.2;
          dino.scaleY = 0.82;
        }
        dino.y = GROUND_Y - 40 * 3;
        dino.vy = 0;
        dino.onGround = true;
      }

      dino.animTime += dt * (speed / 370);

      // Spawn obstacles
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnObstacle();
        const minGap = Math.max(0.68, 1.45 - (speed - 370) / 720);
        spawnTimer = minGap + Math.random() * 0.65;
      }

      const dBox = getDinoHitbox();

      // Move & collide obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= (o.type === "garuda" ? speed * 1.15 : speed) * dt;
        if (o.animTime !== undefined) o.animTime += dt;

        const yOff = o.type === "pillar" ? 10 * 3 : o.type === "naga" ? 13 * 3 : 0;
        const oBox = {
          x: o.x + 14,
          y: o.y + yOff + 10,
          w: o.w - 28,
          h: o.h - yOff - 14,
        };
        if (boxesOverlap(dBox, oBox)) {
          state = "gameover";
          flashTimer = 0.25;
          trauma = 0.85;
          hitStopTimer = 0.08;
          sfx.hit();
          if (Math.floor(score) > highScore) {
            highScore = Math.floor(score);
            localStorage.setItem("angkor_dino_hi", String(highScore));
          }
          break;
        }
        if (o.x + o.w < -40) obstacles.splice(i, 1);
      }

      // Collectibles (Sacred Lotus with Combo Multiplier)
      for (let i = lotuses.length - 1; i >= 0; i--) {
        const l = lotuses[i];
        l.x -= speed * dt;
        l.animTime += dt;
        if (boxesOverlap(dBox, { x: l.x + 8, y: l.y + 8, w: l.w - 16, h: l.h - 16 })) {
          combo = Math.min(4, combo + 1);
          const pts = 50 * combo;
          score += pts;
          trauma = Math.min(1, trauma + 0.18);
          sfx.lotus();
          spawnDust(l.x + 26, l.y + 26, 12, "#ffe373");
          popups.push({ x: l.x + 26, y: l.y, text: combo > 1 ? `+${pts} x${combo}` : `+${pts}`, life: 0.85 });
          lotuses.splice(i, 1);
          continue;
        }
        if (l.x + l.w < -40) {
          combo = 0; // missed a lotus resets combo
          lotuses.splice(i, 1);
        }
      }

      // Particles & popups
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 360 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].y -= 48 * dt;
        popups[i].life -= dt;
        if (popups[i].life <= 0) popups.splice(i, 1);
      }
    }

    let bgTime = 0;
    function drawStripFrame(img, frameW, frameH, frameIdx, dx, dy, scale = S) {
      ctx.drawImage(img, frameIdx * frameW, 0, frameW, frameH, Math.round(dx), Math.round(dy), frameW * scale, frameH * scale);
    }

    function render() {
      if (!assetsLoaded) {
        ctx.fillStyle = "#141020";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#ffe373";
        ctx.font = "bold 24px Courier New";
        ctx.textAlign = "center";
        ctx.fillText("Loading Angkor Dino Assets...", W / 2, H / 2);
        return;
      }

      ctx.save();
      if (trauma > 0) {
        const shake = trauma * trauma;
        ctx.translate(
          Math.round(14 * shake * Math.sin(shakeTime * 1.7)),
          Math.round(10 * shake * Math.sin(shakeTime * 2.3))
        );
      }

      // 1. Animated 16-bit Pixel-Art Backgrounds (Angkor Wat / Bayon / Preah Vihear / Ta Prohm)
      const isLv2 = level === 2;
      const isLv3 = level === 3;
      const isLv4 = level === 4;
      const bgFrame = Math.floor(performance.now() / 167) % 6;
      if (isLv4) {
        ctx.drawImage(imgs.bg_ta_prohm, 0, 0, W, H);
      } else if (isLv3) {
        ctx.drawImage(imgs.bg_preah_vihear, 0, 0, W, H);
        // Animated waterfall shimmer on distant cliff
        for (let i = 0; i < 6; i++) {
          const wy = 190 + ((bgFrame * 14 + i * 16) % 85);
          const wx = 165 + i * 22;
          ctx.fillStyle = "rgba(255, 248, 214, 0.55)";
          ctx.fillRect(wx, wy, 6, 12);
        }
      } else {
        const bgImg = isLv2 ? imgs.bg_bayon : imgs.bg_angkor;
        ctx.drawImage(bgImg, bgFrame * 480, 0, 480, 270, 0, 0, W, H);
      }

      // Subtle atmospheric scrim so foreground sprites pop cleanly
      ctx.fillStyle = isLv2 ? "rgba(10, 8, 22, 0.16)" : isLv4 ? "rgba(10, 22, 16, 0.12)" : isLv3 ? "rgba(40, 18, 45, 0.08)" : "rgba(255, 232, 185, 0.08)";
      ctx.fillRect(0, 0, W, GROUND_Y);

      // Ambient drifting particles (SpriteCast effects on Lv3 & Lv4)
      for (let i = 0; i < motes.length; i++) {
        const m = motes[i];
        const my = m.y + Math.sin(m.phase) * 8;
        if (isLv4) {
          const fxImg = i % 3 === 0 ? imgs.fx_spark : i % 2 === 0 ? imgs.fx_greenleaf : imgs.fx_leaf;
          ctx.drawImage(fxImg, Math.round(m.x), Math.round(my), 12, 12);
        } else if (isLv3) {
          const fxImg = i % 3 === 0 ? imgs.fx_spark : imgs.fx_petal;
          ctx.drawImage(fxImg, Math.round(m.x), Math.round(my), 12, 12);
        } else {
          ctx.fillStyle = isLv2 ? "#ffe373" : "#fff9d6";
          ctx.fillRect(Math.round(m.x), Math.round(my), 3, 3);
        }
      }

      // 2. Ground Tiles (64x48 scaled 2x -> 128x96)
      const gTileW = 128;
      const gOff = Math.floor(dist) % gTileW;
      const gImg = isLv4 ? imgs.ground_tile_lv4 : isLv3 ? imgs.ground_tile_lv3 : isLv2 ? imgs.ground_tile_lv2 : imgs.ground_tile;
      for (let x = -gOff; x < W; x += gTileW) {
        ctx.drawImage(gImg, x, GROUND_Y, gTileW, 96);
      }

      // 3. Lotuses
      for (const l of lotuses) {
        const f = Math.floor(l.animTime * 6) % 4;
        drawStripFrame(imgs.item_lotus, 20, 20, f, l.x, l.y, 3);
      }

      // 4. Obstacles (flush on ground)
      for (const o of obstacles) {
        if (o.type === "pillar") ctx.drawImage(imgs.obs_pillar, Math.round(o.x), Math.round(o.y + 10 * 3), o.w, o.h);
        else if (o.type === "naga") ctx.drawImage(imgs.obs_naga, Math.round(o.x), Math.round(o.y + 13 * 3), o.w, o.h);
        else {
          const f = Math.floor(o.animTime * 8) % 4;
          drawStripFrame(imgs.fly_garuda, 32, 24, f, o.x, o.y, 3);
        }
      }

      // 5. Hero Character (96x96 Arcade Pixel Art @1.3x -> 125x125, feet flush on GROUND_Y)
      const activeChar =
        charMode !== "auto" ? charMode :
        isLv4 ? "garuda" :
        isLv3 ? "hanuman" :
        isLv2 ? "singha" : "dino";

      const is4 = activeChar === "hanuman" || activeChar === "garuda";
      const runImg = imgs[activeChar + "_run"];
      const duckImg = imgs[activeChar + "_duck"];
      const jumpImg = imgs[activeChar + "_jump"];

      const CS = 1.3;
      const fw = 96;
      const fh = 96;
      const dw = 96;
      const dh = 64;
      const runFrames = is4 ? 4 : 6;
      const drawY = dino.y + 40 * 3 - fh * CS;

      ctx.save();
      const pivotX = dino.x + (fw * CS) / 2;
      const pivotY = GROUND_Y;
      ctx.translate(pivotX, pivotY);
      ctx.scale(dino.scaleX, dino.scaleY);
      ctx.translate(-pivotX, -pivotY);

      if (!dino.onGround) {
        const f = dino.vy < 0 ? 0 : 1;
        drawStripFrame(jumpImg, fw, fh, f, dino.x, drawY, CS);
      } else if (dino.ducking && state === "playing") {
        const f = Math.floor(dino.animTime * 10) % 4;
        drawStripFrame(duckImg, dw, dh, f, dino.x, GROUND_Y - dh * CS, CS);
      } else {
        const f = state === "ready" ? 0 : Math.floor(dino.animTime * 10) % runFrames;
        drawStripFrame(runImg, fw, fh, f, dino.x, drawY, CS);
      }
      ctx.restore();

      // 8. Particles & +50 popups
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
      }
      ctx.textAlign = "center";
      ctx.font = "bold 20px Courier New";
      for (const pop of popups) {
        ctx.fillStyle = "#141020";
        ctx.fillText(pop.text, Math.round(pop.x) + 2, Math.round(pop.y) + 2);
        ctx.fillStyle = "#ffe373";
        ctx.fillText(pop.text, Math.round(pop.x), Math.round(pop.y));
      }

      // 9. HUD Score
      ctx.textAlign = "right";
      ctx.font = "bold 26px Courier New";
      ctx.fillStyle = "#141020";
      ctx.fillText(`HI ${String(highScore).padStart(5, "0")}  ${String(Math.floor(score)).padStart(5, "0")}`, W - 26, 40);
      ctx.fillStyle = "#fff6d6";
      ctx.fillText(`HI ${String(highScore).padStart(5, "0")}  ${String(Math.floor(score)).padStart(5, "0")}`, W - 28, 38);

      // 10. Overlays
      if (levelBannerTimer > 0 && state === "playing") {
        ctx.fillStyle = "rgba(20, 16, 32, 0.78)";
        ctx.fillRect(W / 2 - 240, 56, 480, 48);
        ctx.strokeStyle = "#ffe373";
        ctx.lineWidth = 3;
        ctx.strokeRect(W / 2 - 240, 56, 480, 48);
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffe373";
        ctx.font = "bold 22px Courier New";
        ctx.fillText(levelBannerText, W / 2, 87);
      }
      if (state === "ready") {
        ctx.fillStyle = "rgba(20, 16, 32, 0.62)";
        ctx.fillRect(W / 2 - 260, 150, 520, 114);
        ctx.strokeStyle = "#ebb03d";
        ctx.lineWidth = 3;
        ctx.strokeRect(W / 2 - 260, 150, 520, 114);
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffe373";
        ctx.font = "bold 30px Courier New";
        ctx.fillText("ANGKOR DINO RUN", W / 2, 198);
        ctx.fillStyle = "#fff6d6";
        ctx.font = "20px Courier New";
        ctx.fillText("Press SPACE / UP or Click to Start", W / 2, 236);
      } else if (state === "gameover") {
        ctx.fillStyle = "rgba(20, 16, 32, 0.72)";
        ctx.fillRect(W / 2 - 240, 148, 480, 120);
        ctx.strokeStyle = "#eb5963";
        ctx.lineWidth = 3;
        ctx.strokeRect(W / 2 - 240, 148, 480, 120);
        ctx.textAlign = "center";
        ctx.fillStyle = "#ff9ec0";
        ctx.font = "bold 30px Courier New";
        ctx.fillText("GAME OVER", W / 2, 196);
        ctx.fillStyle = "#fff6d6";
        ctx.font = "20px Courier New";
        ctx.fillText("Press SPACE or Click to Retry", W / 2, 236);
      }

      if (flashTimer > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashTimer * 2})`;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    loadAssets().then(() => requestAnimationFrame(loop));
  </script>
</body>
</html>
