<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Angkor Dino Run — Khmer Pixel Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #120e1c;
      color: #fff6d6;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(960px, 100%);
      margin-bottom: 10px;
      gap: 12px;
    }
    h1 {
      font-size: clamp(16px, 2.5vw, 22px);
      color: #ffe373;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #141020;
    }
    .controls-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      background: #2b2142;
      color: #ffe373;
      border: 2px solid #ebb03d;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #3e2f5e; }
    .game-wrap {
      position: relative;
      width: min(960px, 100%);
      aspect-ratio: 16 / 9;
      border: 3px solid #ebb03d;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.7);
      background: #2d1e40;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .footer {
      width: min(960px, 100%);
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: #c4b5d9;
    }
    .touch-btns {
      display: none;
      width: min(960px, 100%);
      gap: 12px;
      margin-top: 10px;
    }
    .touch-btns button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
    }
    @media (pointer: coarse) {
      .touch-btns { display: flex; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ANGKOR DINO RUN</h1>
    <div class="controls-bar">
      <button id="levelBtn">LVL 1: ANGKOR WAT</button>
      <button id="charBtn">CHAR: AUTO</button>
      <button id="muteBtn">SFX: ON</button>
      <button id="restartBtn">RESTART</button>
    </div>
  </div>

  <div class="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>
  </div>

  <div class="touch-btns">
    <button id="touchDuck">DUCK</button>
    <button id="touchJump">JUMP</button>
  </div>

  <div class="footer">
    <span><b>SPACE / UP / W</b>: Jump &nbsp;|&nbsp; <b>DOWN / S</b>: Duck &amp; Fast-Fall</span>
    <span>Built with <b>pxl</b> pixel-art assets (960×540 HD)</span>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const W = 960;
    const H = 540;
    const GROUND_Y = 444; // top of ground_tile (scaled 2x)
    const S = 2; // crisp 2x sprite scale on 960x540 canvas

    // Asset manifest (1x native PNGs generated by pxl)
    const ASSET_PATHS = {
      dino_run: "assets/anims/dino_run.png",
      dino_duck: "assets/anims/dino_duck.png",
      dino_jump: "assets/anims/dino_jump.png",
      singha_run: "assets/anims/singha_run.png",
      singha_duck: "assets/anims/singha_duck.png",
      singha_jump: "assets/anims/singha_jump.png",
      fly_garuda: "assets/anims/fly_garuda.png",
      item_lotus: "assets/anims/item_lotus.png",
      obs_pillar: "assets/sprites/obs_pillar.png",
      obs_naga: "assets/sprites/obs_naga.png",
      ground_tile: "assets/sprites/ground_tile.png",
      bg_sky: "assets/sprites/bg_sky.png",
      bg_temples: "assets/sprites/bg_temples.png",
      bg_jungle: "assets/sprites/bg_jungle.png",
      bg_sky_lv2: "assets/sprites/bg_sky_lv2.png",
      bg_temples_lv2: "assets/sprites/bg_temples_lv2.png",
      bg_jungle_lv2: "assets/sprites/bg_jungle_lv2.png",
      ground_tile_lv2: "assets/sprites/ground_tile_lv2.png",
    };

    const imgs = {};
    let assetsLoaded = false;

    function loadAssets() {
      const entries = Object.entries(ASSET_PATHS);
      let count = 0;
      return new Promise((resolve) => {
        for (const [key, src] of entries) {
          const img = new Image();
          img.onload = () => {
            imgs[key] = img;
            count++;
            if (count === entries.length) {
              assetsLoaded = true;
              resolve();
            }
          };
          img.src = src;
        }
      });
    }

    // Procedural Retro Web Audio SFX
    let audioCtx = null;
    let muted = false;
    function playTone(freq, endFreq, duration, type = "square", vol = 0.08) {
      if (muted) return;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (!audioCtx) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const sfx = {
      jump: () => playTone(240, 520, 0.11, "square", 0.07),
      lotus: () => {
        playTone(587, 880, 0.09, "triangle", 0.1);
        setTimeout(() => playTone(880, 1175, 0.12, "triangle", 0.09), 65);
      },
      milestone: () => {
        playTone(523, 659, 0.1, "square", 0.07);
        setTimeout(() => playTone(659, 1046, 0.16, "square", 0.07), 90);
      },
      hit: () => playTone(180, 55, 0.25, "sawtooth", 0.11),
    };

    // Game State
    const keys = { jump: false, duck: false };
    let state = "ready"; // ready | playing | gameover
    let score = 0;
    let highScore = Number(localStorage.getItem("angkor_dino_hi") || 0);
    let speed = 370; // px/sec on 960x540
    let dist = 0;
    let spawnTimer = 0.8;
    let lastMilestone = 0;
    let flashTimer = 0;
    let shakeTimer = 0;
    let level = 1; // 1 = Angkor Wat Sunrise, 2 = Bayon Twilight
    let manualLevel = null; // null = auto at 300 pts, or 1 / 2
    let charMode = "auto"; // auto | dino | singha
    let levelBannerTimer = 0;
    let levelBannerText = "";

    const dino = {
      x: 112,
      y: GROUND_Y - 50 * S,
      vy: 0,
      onGround: true,
      ducking: false,
      animTime: 0,
      jumpBuffer: 0,
      coyote: 0,
    };

    let obstacles = [];
    let lotuses = [];
    let particles = [];
    let popups = [];
    const motes = Array.from({ length: 18 }, (_, i) => ({
      x: (i * 57) % W,
      y: 60 + ((i * 73) % (GROUND_Y - 90)),
      speed: 25 + (i % 4) * 12,
      phase: i * 0.7,
    }));

    function updateLevelUI() {
      const btn = document.getElementById("levelBtn");
      btn.textContent = level === 1 ? "LVL 1: ANGKOR WAT" : "LVL 2: BAYON NIGHT";
    }

    function resetGame() {
      score = manualLevel === 2 ? 300 : 0;
      level = manualLevel ?? 1;
      speed = level === 2 ? 500 : 370;
      dist = 0;
      spawnTimer = 0.9;
      lastMilestone = Math.floor(score / 100);
      flashTimer = 0;
      shakeTimer = 0;
      levelBannerTimer = level === 2 ? 2.0 : 0;
      levelBannerText = level === 2 ? "LEVEL 2: BAYON TWILIGHT!" : "";
      dino.y = GROUND_Y - 50 * S;
      dino.vy = 0;
      dino.onGround = true;
      dino.ducking = false;
      dino.animTime = 0;
      dino.jumpBuffer = 0;
      obstacles = [];
      lotuses = [];
      particles = [];
      popups = [];
      state = "playing";
      updateLevelUI();
    }

    function spawnDust(x, y, count = 6, color = "#e6c69c") {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 28,
          y: y - Math.random() * 8,
          vx: -80 - Math.random() * 120,
          vy: -40 - Math.random() * 100,
          life: 0.35 + Math.random() * 0.25,
          maxLife: 0.6,
          size: Math.random() < 0.5 ? 4 : 6,
          color,
        });
      }
    }

    function spawnObstacle() {
      const r = Math.random();
      if (score > 80 && r < 0.32) {
        const high = Math.random() < 0.6;
        obstacles.push({
          type: "garuda",
          x: W + 40,
          y: high ? GROUND_Y - 64 * S : GROUND_Y - 38 * S,
          w: 42 * S,
          h: 34 * S,
          animTime: Math.random() * 0.5,
        });
      } else if (r < 0.66) {
        obstacles.push({
          type: "pillar",
          x: W + 40,
          y: GROUND_Y - 50 * S,
          w: 34 * S,
          h: 50 * S,
        });
      } else {
        obstacles.push({
          type: "naga",
          x: W + 40,
          y: GROUND_Y - 42 * S,
          w: 50 * S,
          h: 42 * S,
        });
      }

      if (Math.random() < 0.45) {
        lotuses.push({
          x: W + 220 + Math.random() * 120,
          y: GROUND_Y - (Math.random() < 0.5 ? 36 * S : 74 * S),
          w: 26 * S,
          h: 26 * S,
          animTime: 0,
        });
      }
    }

    function getDinoHitbox() {
      if (dino.ducking && dino.onGround) {
        return { x: dino.x + 16, y: GROUND_Y - 52, w: 84, h: 48 };
      }
      return { x: dino.x + 24, y: dino.y + 16, w: 52, h: 76 };
    }

    function boxesOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function triggerJump() {
      if (state === "ready" || state === "gameover") {
        resetGame();
        return;
      }
      dino.jumpBuffer = 0.12;
    }

    // Input listeners
    window.addEventListener("keydown", (e) => {
      if (["Space", "ArrowUp", "KeyW"].includes(e.code)) {
        e.preventDefault();
        if (!keys.jump) triggerJump();
        keys.jump = true;
      }
      if (["ArrowDown", "KeyS"].includes(e.code)) {
        e.preventDefault();
        keys.duck = true;
      }
    });
    window.addEventListener("keyup", (e) => {
      if (["Space", "ArrowUp", "KeyW"].includes(e.code)) keys.jump = false;
      if (["ArrowDown", "KeyS"].includes(e.code)) keys.duck = false;
    });

    canvas.addEventListener("pointerdown", () => triggerJump());
    document.getElementById("restartBtn").addEventListener("click", () => resetGame());
    document.getElementById("levelBtn").addEventListener("click", () => {
      manualLevel = level === 1 ? 2 : 1;
      level = manualLevel;
      levelBannerTimer = 2.0;
      levelBannerText = level === 2 ? "LEVEL 2: BAYON TWILIGHT!" : "LEVEL 1: ANGKOR WAT!";
      updateLevelUI();
      if (state === "ready") render();
    });
    document.getElementById("charBtn").addEventListener("click", (e) => {
      charMode = charMode === "auto" ? "dino" : charMode === "dino" ? "singha" : "auto";
      e.target.textContent = "CHAR: " + charMode.toUpperCase();
    });
    document.getElementById("muteBtn").addEventListener("click", (e) => {
      muted = !muted;
      e.target.textContent = muted ? "SFX: OFF" : "SFX: ON";
    });
    document.getElementById("touchJump").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      triggerJump();
      keys.jump = true;
    });
    document.getElementById("touchJump").addEventListener("pointerup", () => { keys.jump = false; });
    document.getElementById("touchDuck").addEventListener("pointerdown", (e) => {
      e.preventDefault();
      keys.duck = true;
    });
    document.getElementById("touchDuck").addEventListener("pointerup", () => { keys.duck = false; });

    function update(dt) {
      if (flashTimer > 0) flashTimer -= dt;
      if (shakeTimer > 0) shakeTimer -= dt;
      if (levelBannerTimer > 0) levelBannerTimer -= dt;

      for (const m of motes) {
        m.x -= (m.speed + (state === "playing" ? speed * 0.15 : 0)) * dt;
        m.phase += dt * 3;
        if (m.x < -8) m.x = W + 8;
      }

      if (state !== "playing") {
        dino.animTime += dt;
        return;
      }

      // Ramp speed smoothly
      speed = Math.min(860, 370 + score * 0.44);
      dist += speed * dt;
      score += dt * 14;

      // Auto-advance to Level 2 at 300 points (unless pinned to Level 1)
      if (manualLevel === null && level === 1 && score >= 300) {
        level = 2;
        levelBannerTimer = 2.4;
        levelBannerText = "LEVEL 2: BAYON TWILIGHT!";
        flashTimer = 0.2;
        sfx.milestone();
        updateLevelUI();
      }

      const curMilestone = Math.floor(score / 100);
      if (curMilestone > lastMilestone && curMilestone > 0) {
        lastMilestone = curMilestone;
        sfx.milestone();
      }

      // Dino jump & gravity
      dino.ducking = keys.duck;
      if (dino.onGround) dino.coyote = 0.08;
      else dino.coyote = Math.max(0, dino.coyote - dt);

      if (dino.jumpBuffer > 0) dino.jumpBuffer -= dt;

      if (dino.jumpBuffer > 0 && dino.coyote > 0) {
        dino.vy = -750;
        dino.onGround = false;
        dino.coyote = 0;
        dino.jumpBuffer = 0;
        sfx.jump();
        spawnDust(dino.x + 44, GROUND_Y, 8);
      }

      // Variable jump height & fast-fall
      let grav = 2300;
      if (dino.vy < 0 && !keys.jump) grav = 3800;
      if (keys.duck && !dino.onGround) grav = 5000;

      dino.vy += grav * dt;
      dino.y += dino.vy * dt;

      if (dino.y >= GROUND_Y - 50 * S) {
        if (!dino.onGround) spawnDust(dino.x + 44, GROUND_Y, 5);
        dino.y = GROUND_Y - 50 * S;
        dino.vy = 0;
        dino.onGround = true;
      }

      dino.animTime += dt * (speed / 370);

      // Spawn obstacles
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnObstacle();
        const minGap = Math.max(0.68, 1.45 - (speed - 370) / 720);
        spawnTimer = minGap + Math.random() * 0.65;
      }

      const dBox = getDinoHitbox();

      // Move & collide obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= (o.type === "garuda" ? speed * 1.15 : speed) * dt;
        if (o.animTime !== undefined) o.animTime += dt;

        const oBox = {
          x: o.x + 14,
          y: o.y + 12,
          w: o.w - 28,
          h: o.h - 20,
        };
        if (boxesOverlap(dBox, oBox)) {
          state = "gameover";
          flashTimer = 0.25;
          shakeTimer = 0.22;
          sfx.hit();
          if (Math.floor(score) > highScore) {
            highScore = Math.floor(score);
            localStorage.setItem("angkor_dino_hi", String(highScore));
          }
          break;
        }
        if (o.x + o.w < -40) obstacles.splice(i, 1);
      }

      // Collectibles (Sacred Lotus)
      for (let i = lotuses.length - 1; i >= 0; i--) {
        const l = lotuses[i];
        l.x -= speed * dt;
        l.animTime += dt;
        if (boxesOverlap(dBox, { x: l.x + 8, y: l.y + 8, w: l.w - 16, h: l.h - 16 })) {
          score += 50;
          sfx.lotus();
          spawnDust(l.x + 26, l.y + 26, 12, "#ffe373");
          popups.push({ x: l.x + 26, y: l.y, text: "+50", life: 0.8 });
          lotuses.splice(i, 1);
          continue;
        }
        if (l.x + l.w < -40) lotuses.splice(i, 1);
      }

      // Particles & popups
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 360 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].y -= 48 * dt;
        popups[i].life -= dt;
        if (popups[i].life <= 0) popups.splice(i, 1);
      }
    }

    function drawStripFrame(img, frameW, frameH, frameIdx, dx, dy) {
      ctx.drawImage(img, frameIdx * frameW, 0, frameW, frameH, Math.round(dx), Math.round(dy), frameW * S, frameH * S);
    }

    function render() {
      if (!assetsLoaded) {
        ctx.fillStyle = "#141020";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#ffe373";
        ctx.font = "bold 24px Courier New";
        ctx.textAlign = "center";
        ctx.fillText("Loading Angkor Dino Assets...", W / 2, H / 2);
        return;
      }

      ctx.save();
      if (shakeTimer > 0) {
        ctx.translate(Math.round((Math.random() - 0.5) * 10), Math.round((Math.random() - 0.5) * 10));
      }

      // 1. Sky (960x540 native)
      const isLv2 = level === 2;
      ctx.drawImage(isLv2 ? imgs.bg_sky_lv2 : imgs.bg_sky, 0, 0);

      // 2. Parallax Distant Temples (Angkor Wat / Bayon, 960x280 native)
      const templeOff = Math.floor(dist * 0.12) % W;
      const tImg = isLv2 ? imgs.bg_temples_lv2 : imgs.bg_temples;
      ctx.drawImage(tImg, -templeOff, GROUND_Y - 280);
      ctx.drawImage(tImg, W - templeOff, GROUND_Y - 280);

      // 3. Parallax Midground Palms & Jungle (960x200 native)
      const jungleOff = Math.floor(dist * 0.35) % W;
      const jImg = isLv2 ? imgs.bg_jungle_lv2 : imgs.bg_jungle;
      ctx.drawImage(jImg, -jungleOff, GROUND_Y - 200);
      ctx.drawImage(jImg, W - jungleOff, GROUND_Y - 200);

      // Ambient drifting golden dust motes / fireflies
      for (const m of motes) {
        const my = m.y + Math.sin(m.phase) * 6;
        ctx.fillStyle = isLv2 ? "#ffe373" : "#fff9d6";
        ctx.fillRect(Math.round(m.x), Math.round(my), 3, 3);
      }

      // 4. Ground Tiles (64x48 scaled 2x -> 128x96)
      const gTileW = 64 * S;
      const gOff = Math.floor(dist) % gTileW;
      const gImg = isLv2 ? imgs.ground_tile_lv2 : imgs.ground_tile;
      for (let x = -gOff; x < W; x += gTileW) {
        ctx.drawImage(gImg, x, GROUND_Y, gTileW, 48 * S);
      }

      // 5. Lotuses
      for (const l of lotuses) {
        const f = Math.floor(l.animTime * 6) % 4;
        drawStripFrame(imgs.item_lotus, 26, 26, f, l.x, l.y);
      }

      // 6. Obstacles
      for (const o of obstacles) {
        if (o.type === "pillar") ctx.drawImage(imgs.obs_pillar, Math.round(o.x), Math.round(o.y), o.w, o.h);
        else if (o.type === "naga") ctx.drawImage(imgs.obs_naga, Math.round(o.x), Math.round(o.y), o.w, o.h);
        else {
          const f = Math.floor(o.animTime * 8) % 4;
          drawStripFrame(imgs.fly_garuda, 42, 34, f, o.x, o.y);
        }
      }

      // 7. Hero Character (Royal Khmer Dino on Lv1, Golden Khmer Singha on Lv2)
      const useSingha = charMode === "singha" || (charMode === "auto" && isLv2);
      const runImg = useSingha ? imgs.singha_run : imgs.dino_run;
      const duckImg = useSingha ? imgs.singha_duck : imgs.dino_duck;
      const jumpImg = useSingha ? imgs.singha_jump : imgs.dino_jump;

      if (!dino.onGround) {
        const f = dino.vy < 0 ? 0 : 1;
        drawStripFrame(jumpImg, 50, 50, f, dino.x, dino.y);
      } else if (dino.ducking && state === "playing") {
        const f = Math.floor(dino.animTime * 10) % 4;
        drawStripFrame(duckImg, 58, 34, f, dino.x, GROUND_Y - 34 * S);
      } else {
        const f = state === "ready" ? 0 : Math.floor(dino.animTime * 10) % 6;
        drawStripFrame(runImg, 50, 50, f, dino.x, dino.y);
      }

      // 8. Particles & +50 popups
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
      }
      ctx.textAlign = "center";
      ctx.font = "bold 20px Courier New";
      for (const pop of popups) {
        ctx.fillStyle = "#141020";
        ctx.fillText(pop.text, Math.round(pop.x) + 2, Math.round(pop.y) + 2);
        ctx.fillStyle = "#ffe373";
        ctx.fillText(pop.text, Math.round(pop.x), Math.round(pop.y));
      }

      // 9. HUD Score
      ctx.textAlign = "right";
      ctx.font = "bold 26px Courier New";
      ctx.fillStyle = "#141020";
      ctx.fillText(`HI ${String(highScore).padStart(5, "0")}  ${String(Math.floor(score)).padStart(5, "0")}`, W - 26, 40);
      ctx.fillStyle = "#fff6d6";
      ctx.fillText(`HI ${String(highScore).padStart(5, "0")}  ${String(Math.floor(score)).padStart(5, "0")}`, W - 28, 38);

      // 10. Overlays
      if (levelBannerTimer > 0 && state === "playing") {
        ctx.fillStyle = "rgba(20, 16, 32, 0.78)";
        ctx.fillRect(W / 2 - 240, 56, 480, 48);
        ctx.strokeStyle = "#ffe373";
        ctx.lineWidth = 3;
        ctx.strokeRect(W / 2 - 240, 56, 480, 48);
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffe373";
        ctx.font = "bold 22px Courier New";
        ctx.fillText(levelBannerText, W / 2, 87);
      }
      if (state === "ready") {
        ctx.fillStyle = "rgba(20, 16, 32, 0.62)";
        ctx.fillRect(W / 2 - 260, 150, 520, 114);
        ctx.strokeStyle = "#ebb03d";
        ctx.lineWidth = 3;
        ctx.strokeRect(W / 2 - 260, 150, 520, 114);
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffe373";
        ctx.font = "bold 30px Courier New";
        ctx.fillText("ANGKOR DINO RUN", W / 2, 198);
        ctx.fillStyle = "#fff6d6";
        ctx.font = "20px Courier New";
        ctx.fillText("Press SPACE / UP or Click to Start", W / 2, 236);
      } else if (state === "gameover") {
        ctx.fillStyle = "rgba(20, 16, 32, 0.72)";
        ctx.fillRect(W / 2 - 240, 148, 480, 120);
        ctx.strokeStyle = "#eb5963";
        ctx.lineWidth = 3;
        ctx.strokeRect(W / 2 - 240, 148, 480, 120);
        ctx.textAlign = "center";
        ctx.fillStyle = "#ff9ec0";
        ctx.font = "bold 30px Courier New";
        ctx.fillText("GAME OVER", W / 2, 196);
        ctx.fillStyle = "#fff6d6";
        ctx.font = "20px Courier New";
        ctx.fillText("Press SPACE or Click to Retry", W / 2, 236);
      }

      if (flashTimer > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashTimer * 2})`;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    loadAssets().then(() => requestAnimationFrame(loop));
  </script>
</body>
</html>
